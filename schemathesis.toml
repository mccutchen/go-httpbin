[phases.coverage]
# go-httpbin intentionally accepts any HTTP method on endpoints that are not
# restricted to a specific method subset (e.g. /anything, /delay, /status,
# etc.). Testing non-standard methods like QUERY against these endpoints and
# expecting a 405 is not meaningful here, so we disable that probe entirely.
unexpected-methods = []

[filter]
# /brotli intentionally returns 501 Not Implemented — it is a known,
# documented stub for an unimplemented feature. Exclude it from testing
# entirely so the not_a_server_error check doesn't flag it.
exclude = [{path = "/brotli"}]
