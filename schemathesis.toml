# NOTE ON REDIRECTS: Schemathesis uses `requests` under the hood and never
# passes `allow_redirects`, so it always *follows* redirects. There is no
# config knob to turn that off — `max-redirects` only caps the chain length,
# and setting it to 0 makes `requests` raise TooManyRedirects on the first hop.
# So for every redirecting endpoint the status Schemathesis observes is the one
# from the final destination, not the 3xx itself. The redirect endpoints
# document a `default` response to cover that.

# The redirect endpoints accept counts up to 100, so the chain has to be
# allowed to run to completion; `requests` defaults to 30.
max-redirects = 120

# NOTE ON PARAMETER VALUES: several parameters accept far more than it is
# useful (or safe) to generate at random — durations bounded only at runtime,
# redirect targets that would send the test client to an arbitrary internet
# host, byte ranges whose satisfiability depends on a second parameter. Rather
# than narrowing openapi.json (which documents the real API, not this test
# run), the values are pinned here via dictionaries.

[dictionaries]

# Durations comfortably inside the server's maximum duration (10s by default).
# Kept short so that slow responses do not hold a keep-alive connection open
# and stall the requests queued behind them.
short-durations.values = ["0", "1ms", "50ms", "0.1s", "250ms", "500ms"]

# /jsonl and /sse reject a `duration` of zero, and additionally reject
# `duration` + `delay` greater than the server's maximum duration.
positive-durations.values = ["1ms", "50ms", "0.1s", "250ms", "500ms"]

# Same-origin redirect targets, so following a redirect never leaves the
# server under test.
local-redirect-targets.values = ["/get", "/anything", "/html", "/status/200"]

# Ranges starting at 0 are satisfiable for any `numbytes`, because the end of
# the range is clamped to the content length.
satisfiable-ranges.values = ["bytes=0-", "bytes=0-0", "bytes=0-9", "bytes=0-1023"]

[generation]
# Generate only schema-valid data. Schemathesis defaults to running both
# positive and negative generation, but go-httpbin is deliberately permissive
# about unexpected input (which is why `negative_data_rejection` is disabled
# below), so negative generation produces no actionable signal here. It does
# actively get in the way: negative values for the redirect-count parameters
# ignore the documented maximum, and the server will happily begin an
# arbitrarily long redirect chain, which fails the run with a transport error
# rather than a check failure.
mode = "positive"

[phases.coverage]
# go-httpbin intentionally accepts any HTTP method on endpoints that are not
# restricted to a specific method subset (e.g. /anything, /delay, /status,
# etc.). Testing non-standard methods like QUERY against these endpoints and
# expecting a 405 is not meaningful here, so we disable that probe entirely.
unexpected-methods = []
# Duplicate query parameters are not meaningful to test for go-httpbin.
generate-duplicate-query-parameters = false

[checks]
# go-httpbin intentionally accepts extra/unknown query parameters (like most
# HTTP servers). The coverage phase generates requests with unknown parameters
# to test strict APIs, but this is not meaningful for go-httpbin which is
# designed to be permissive. Disable the check globally.
negative_data_rejection = {enabled = false}

# go-httpbin is entirely stateless — no endpoint creates, stores, or frees a
# resource. The stateful phase nonetheless reads a DELETE followed by a
# successful GET on the same path (e.g. /anything/{anything}, /delay/{delay})
# as a use-after-free, which cannot happen here by construction.
use_after_free = {enabled = false}

# /brotli intentionally returns 501 Not Implemented — it is a known,
# documented stub for an unimplemented feature, not a real server error.
[[operations]]
include-path = "/brotli"

[operations.checks]
not_a_server_error = {enabled = false}

# /hidden-basic-auth intentionally returns 404 (not 401) when auth is missing
# or incorrect — that's the "hidden" aspect of the endpoint, which doesn't
# reveal that authentication is required.
[[operations]]
include-path = "/hidden-basic-auth/{user}/{password}"

[operations.checks]
missing_required_header = {enabled = false}

# /drip, /delay, and /sse are streaming/delay endpoints designed to be slow
# by construction. Disable the response-time check for these.
[[operations]]
include-path-regex = "^/(drip|delay|sse)"

[operations.checks]
max_response_time = 10

# Pin the duration-valued parameters to short, always-in-bounds values. The
# schema documents the full Go duration syntax the server accepts, but the
# upper bound is a runtime limit (MaxDuration) that a JSON Schema pattern
# cannot express, and long durations stall the connections queued behind them.
[[operations]]
include-path = "/delay/{delay}"

[operations.parameters]
"path.delay" = {dictionary = "short-durations", probability = 1.0}

[[operations]]
include-path = "/drip"

[operations.parameters]
"query.duration" = {dictionary = "short-durations", probability = 1.0}
"query.delay" = {dictionary = "short-durations", probability = 1.0}

[[operations]]
include-path = "/jsonl"

[operations.parameters]
"query.duration" = {dictionary = "positive-durations", probability = 1.0}
"query.delay" = {dictionary = "short-durations", probability = 1.0}

[[operations]]
include-path = "/sse"

[operations.parameters]
"query.duration" = {dictionary = "positive-durations", probability = 1.0}
"query.delay" = {dictionary = "short-durations", probability = 1.0}

# A range's satisfiability depends on `numbytes`, which the schema cannot
# express, so pin it to ranges that are valid for any content length.
[[operations]]
include-path = "/range/{numbytes}"

[operations.parameters]
"header.Range" = {dictionary = "satisfiable-ranges", probability = 1.0}

# /unstable randomly returns 500 by design (it's the whole point of the
# endpoint). Disable the server-error check for it.
[[operations]]
include-path = "/unstable"

[operations.checks]
not_a_server_error = {enabled = false}

# /basic-auth, /bearer, and /hidden-basic-auth all accept credentials supplied
# by the caller in the URL path. Schemathesis generates auth headers whose
# tokens happen to match those path parameters, triggering the `ignored_auth`
# check as a false positive.
[[operations]]
include-path-regex = "^/(basic-auth|bearer|hidden-basic-auth)"

[operations.checks]
ignored_auth = {enabled = false}

# /cache returns 304 and /etag returns 412 for valid conditional requests.
# These are correct HTTP conditional-response codes, not rejections, but the
# positive_data_acceptance check treats non-2xx/4xx codes as rejections.
[[operations]]
include-path-regex = "^/(cache$|etag)"

[operations.checks]
positive_data_acceptance = {enabled = false}

# /base64/decode and /base64/{value} validate that the input is valid base64.
# Strings that match the character-set pattern may still be rejected due to
# invalid padding or length. Disable the positive_data_acceptance check since
# returning 400 for invalid-but-syntactically-plausible input is correct.
[[operations]]
include-path-regex = "^/base64/(decode/|\\{)"

[operations.checks]
positive_data_acceptance = {enabled = false}

# /drip accepts a `code` query parameter that sets the HTTP response status code
# (100-599). The server intentionally returns whatever code is requested, which
# may be 1xx, 3xx, or 5xx. The positive_data_acceptance and not_a_server_error
# checks cannot be suppressed via spec-level wildcard responses, so we disable
# them here.
[[operations]]
include-path = "/drip"

[operations.checks]
not_a_server_error = {enabled = false}
positive_data_acceptance = {enabled = false}

# /status/{codes} returns whatever status code the caller asks for, anywhere in
# [100, 599] — that is the entire purpose of the endpoint. As with /drip below,
# a requested 4xx is not a rejection of valid input and a requested 5xx is not a
# server error.
[[operations]]
include-path = "/status/{codes}"

[operations.checks]
not_a_server_error = {enabled = false}
positive_data_acceptance = {enabled = false}

# /redirect-to is followed to its destination (see the note at the top of this
# file), so the status Schemathesis sees comes from the target endpoint rather
# than from /redirect-to. Pointing it at, say, /upload yields a 405 that says
# nothing about whether /redirect-to accepted its own input.
[[operations]]
include-path = "/redirect-to"

[operations.checks]
positive_data_acceptance = {enabled = false}

# The schema documents `url` as any URI, which is what the endpoint accepts.
# Generating one at random would send the test client (which follows
# redirects) off to an arbitrary internet host, so pin it to same-origin paths.
[operations.parameters]
"query.url" = {dictionary = "local-redirect-targets", probability = 1.0}

# /websocket/echo only speaks HTTP far enough to perform a WebSocket upgrade
# handshake. Schemathesis issues ordinary HTTP requests, which the endpoint
# correctly rejects with 400 ("missing required `Upgrade: websocket` header").
# That rejection is the documented behavior, not a failure to accept valid
# input, and the handshake itself is not expressible in OpenAPI.
[[operations]]
include-path = "/websocket/echo"

[operations.checks]
positive_data_acceptance = {enabled = false}
